<!doctype html>
<html lang="en-US">
<head>
    <meta charset="utf-8" />
    <title>My test page</title>
    {% load static %}  
    <link rel="stylesheet" href="{% static 'polls/style.css' %}">
</head>
<body>
    <div >
        <div class="header">
            <h1>{{ question.question_text }}</h1>
        </div>
        
        <div class="links header">
            <a href="{% url 'polls:index' %}" class="boton-link">Inicio</a>
            <a href="{% url 'polls:agregar_pregunta' %}" class="boton-link">Agregar nueva pregunta</a>
            <a href="{% url 'polls:mapa_leaflet' %}" class="boton-link">Mapa</a>
        </div>
    </div>
  
    
    <ul>
        {% for choice in question.choice_set.all %}
        <li>{{ choice.choice_text }} -- {{ choice.votes }} vote{{ choice.votes|pluralize }}</li>
        {% endfor %}
    </ul>
    
    <a class="links"  href="{% url 'polls:detail' question.id %}">Vota otra vez?</a>
</body>
</html>
