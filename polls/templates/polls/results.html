<!doctype html>
<html lang="en-US">
<head>
    <meta charset="utf-8" />
    <title>My test page</title>
</head>
<body>
    <div class="header">
        <h1>{{ question.question_text }}</h1>
        <div class="links">
            <a href="{% url 'polls:index' %}">Inicio</a>
            <a href="{% url 'polls:agregar_pregunta' %}">Agregar nueva pregunta</a>
            <a href="{% url 'polls:mapa_leaflet' %}">Mapa</a>
        </div>
    </div>
  
    
    <ul>
        {% for choice in question.choice_set.all %}
        <li>{{ choice.choice_text }} -- {{ choice.votes }} vote{{ choice.votes|pluralize }}</li>
        {% endfor %}
    </ul>
    
    <a href="{% url 'polls:detail' question.id %}">Vota otra vez?</a>
</body>
</html>
